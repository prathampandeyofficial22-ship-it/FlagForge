version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: flagforge-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flagforge
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: flagforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
