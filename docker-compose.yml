version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: flagforge-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: flagforge
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7.2-alpine
    container_name: flagforge-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flagforge-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongodb:27017/flagforge
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: "true"
      JWT_SECRET: production-secret-flagforge-jwt-key-replace-in-env
      CORS_ORIGIN: http://localhost:80
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: flagforge-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
